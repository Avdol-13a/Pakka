name: Verify Pakka
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run train
      - name: Check reproducible data and weights
        run: git diff --exit-code -- data public/model.json docs/EVALUATION.md docs/evaluation.json
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            docs/e2e-results.json
            test-results
            dist
